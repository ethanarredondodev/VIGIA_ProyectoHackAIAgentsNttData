name: vigia

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 20

x-servicio: &servicio
  restart: unless-stopped

services:
  # Proyecto `operacion`: trabajadores, trabajos, historial de trabajos, labores, condiciones, clima, incidentes,
  # PTW y checkpoints de LangGraph.
  vigia-db-operacion:
    <<: *postgres
    environment:
      POSTGRES_DB: operacion
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: vigia_local
    volumes: [db_operacion:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    networks: [operacion]

  # Proyecto `clinica`: solo el gemelo. Red interna sin puerto publicado.
  vigia-db-clinica:
    <<: *postgres
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: vigia_clinica
      POSTGRES_PASSWORD: vigia_clinica_local
    volumes: [db_clinica:/var/lib/postgresql/data]
    networks: [clinica]

  vigia-nanda:
    <<: *servicio
    build: {context: ., dockerfile: nanda_index/Dockerfile}
    environment:
      NANDA_OFICIAL_URL: ${NANDA_OFICIAL_URL:-}
    ports: ["8010:8000"]
    networks: [operacion]

  vigia-incidentes:
    <<: *servicio
    build: {context: ., dockerfile: agents/incidentes/Dockerfile}
    environment:
      DATABASE_URL: postgresql://vigia:vigia_local@vigia-db-operacion:5432/operacion
      NANDA_URL: http://vigia-nanda:8000
      AGENT_URL: http://vigia-incidentes:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      vigia-db-operacion: {condition: service_healthy}
    ports: ["8011:8000"]
    networks: [operacion]

  vigia-area:
    <<: *servicio
    build: {context: ., dockerfile: agents/area/Dockerfile}
    environment:
      DATABASE_URL: postgresql://vigia:vigia_local@vigia-db-operacion:5432/operacion
      NANDA_URL: http://vigia-nanda:8000
      AGENT_URL: http://vigia-area:8000
    depends_on:
      vigia-db-operacion: {condition: service_healthy}
    ports: ["8012:8000"]
    networks: [operacion]

  # Zona clinica: sin puerto publicado; solo vigia-ptw lo llama. No recibe la clave de Claude.
  vigia-gemelo:
    <<: *servicio
    build: {context: ., dockerfile: agents/gemelo/Dockerfile}
    environment:
      DATABASE_URL: postgresql://vigia_clinica:vigia_clinica_local@vigia-db-clinica:5432/clinica
      NANDA_URL: http://vigia-nanda:8000
      AGENT_URL: http://vigia-gemelo:8000
      SHEETS_REGLAS_ZONA_CLINICA_URL: ${SHEETS_REGLAS_ZONA_CLINICA_URL:-}
    depends_on:
      vigia-db-clinica: {condition: service_healthy}
    networks: [operacion, clinica]

  vigia-ptw:
    <<: *servicio
    build: {context: ., dockerfile: agents/ptw/Dockerfile}
    environment:
      DATABASE_URL: postgresql://vigia:vigia_local@vigia-db-operacion:5432/operacion
      NANDA_URL: http://vigia-nanda:8000
      AGENT_URL: http://vigia-ptw:8000
      INCIDENTES_URL: http://vigia-incidentes:8000
      AREA_URL: http://vigia-area:8000
      GEMELO_URL: http://vigia-gemelo:8000
      MOCK_MODE: ${MOCK_MODE:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://localhost:5173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      SHEETS_LIMITES_AREA_URL: ${SHEETS_LIMITES_AREA_URL:-}
      SHEETS_CONTROLES_IPERC_URL: ${SHEETS_CONTROLES_IPERC_URL:-}
    depends_on:
      vigia-db-operacion: {condition: service_healthy}
      vigia-nanda: {condition: service_started}
      vigia-incidentes: {condition: service_started}
      vigia-area: {condition: service_started}
      vigia-gemelo: {condition: service_started}
    ports: ["8000:8000"]
    networks: [operacion]

  vigia-ui:
    <<: *servicio
    build: {context: ., dockerfile: ui/Dockerfile}
    environment:
      PTW_URL: http://vigia-ptw:8000
    depends_on: [vigia-ptw]
    ports: ["8501:8501"]
    networks: [operacion]

networks:
  operacion:
  clinica:
    internal: true

volumes:
  db_operacion:
  db_clinica:
